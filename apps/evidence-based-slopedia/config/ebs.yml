auto_generation:
  enabled: true
  interval:
    min_minutes: 5
    max_minutes: 10
  max_per_hour: 6
  max_per_day: 50
  topic_sources:
    existing_article: 0.55
    wikipedia_random: 0.30
    maintenance: 0.15
  dedup:
    semantic_enabled: false
    duplicate_threshold: 0.90
    review_threshold: 0.80
  cooldown:
    failure_minutes: [60, 360, 1440, 10080]
  circuit_breaker:
    window: 10
    max_failures: 5
    cooldown_minutes: 60
  seed:
    existing_article_cooldown_hours: 24
    max_children_per_seed: 5
wikipedia:
  languages: [ja, en]
  timeout_ms: 8000
  retry_limit: 2
resources:
  max_cpu_percent: 80
  max_ram_percent: 80
  min_disk_free_gb: 5
workers:
  article_concurrency: 1
site:
  base_path: /
  origin: ""
images:
  max_bytes: 250000
  webp_quality: 78
  width: 1200
  height: 675
news:
  daily: true
  categories:
    - Politics_International_Relations
    - Economy_Finance
    - Technology_AI
    - Science_Medicine_Life
    - Environment_Energy_Resources
    - Society_Population_Education
    - Culture_Media_Ideas
    - Law_Institutions_Ethics
    - Business_Industry_Innovation
    - Incidents_Risks_Safety
deploy:
  auto:
    every_articles: 5
    max_interval_minutes: 30
  human_immediate: true
backup:
  daily: true
  retention:
    daily: 7
    weekly: 4
    monthly: 3
