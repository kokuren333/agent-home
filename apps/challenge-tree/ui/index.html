<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10233b">
  <link rel="stylesheet" href="/ui/styles.css">
  <link rel="stylesheet" href="/apps/challenge-tree/ui/styles.css?v=1">
  <title>Challenge Tree</title>
</head>
<body>
  <main class="ct-shell">
    <header class="ct-header">
      <a class="back-link" href="/">‹ アプリ</a>
      <div><p class="eyebrow">ADAPTIVE LEARNING</p><h1>Challenge Tree</h1></div>
      <span id="backend-state" class="backend-state">確認中</span>
    </header>
    <section id="home-view" class="view">
      <div class="hero"><div><p class="eyebrow">LEARN BY BUILDING</p><h2>知識を、育てる。</h2><p>答えるたびに、次の学習ノードが開きます。</p></div><button id="new-workspace" class="primary-button">＋ 学習を始める</button></div>
      <div class="section-title"><h2>学習ワークスペース</h2><button id="reload-workspaces" class="secondary-button">更新</button></div>
      <div id="workspace-list" class="workspace-list"><p class="muted">読み込んでいます…</p></div>
    </section>
    <section id="workspace-view" class="view" hidden>
      <div class="workspace-heading"><div><button id="back-home" class="back-button">‹ 一覧</button><h2 id="workspace-title"></h2><p id="workspace-subtitle" class="muted"></p></div><button id="delete-workspace" class="danger-button">削除</button></div>
      <div id="notice" class="notice" hidden></div>
      <div class="workspace-layout">
        <section class="tree-panel panel"><div class="panel-heading"><div><p class="eyebrow">KNOWLEDGE TREE</p><h3>学習ノード</h3></div><button id="generate-tree" class="secondary-button">AIでツリーを作る</button></div><div id="tree-list" class="tree-list"></div></section>
        <section class="challenge-panel panel"><div class="panel-heading"><div><p class="eyebrow">CHALLENGE</p><h3 id="challenge-title">ノードを選択</h3></div><span id="challenge-grade" class="grade" hidden></span></div><div id="challenge-content" class="challenge-content"><div class="empty-state"><span>✦</span><strong>学習ノードを選んでください</strong><p>ツリーを作成すると、ここに問題が表示されます。</p></div></div></section>
      </div>
    </section>
  </main>
  <dialog id="workspace-dialog" class="ct-dialog"><form id="workspace-form" method="dialog"><p class="eyebrow">NEW WORKSPACE</p><h2>学習を始める</h2><label>テーマ<input id="workspace-topic" required maxlength="120" placeholder="例：機械学習の基礎"></label><label>目標<textarea id="workspace-goal" rows="3" placeholder="何ができるようになりたい？"></textarea></label><div class="dialog-actions"><button type="button" class="secondary-button" id="cancel-workspace">キャンセル</button><button class="primary-button" value="save">作成</button></div></form></dialog>
  <script type="module" src="/apps/challenge-tree/ui/app.js?v=1"></script>
</body>
</html>
