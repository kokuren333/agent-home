<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/ui/styles.css"><title>Hello Agent</title></head><body><main class="shell"><h1>Hello Agent</h1><p class="sub">Character Chatと同じApp Protocolで動く、最小の第二アプリです。</p><button id="run" class="ghost" style="margin-top:28px">Agentを実行</button><pre id="output" style="white-space:pre-wrap;color:#bae6fd;margin-top:20px"></pre><p><a href="/" style="color:#7dd3fc">‹ Launcherへ戻る</a></p></main><script>document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#output');const r=await (await fetch('/api/apps/demo-app/runs',{method:'POST',headers:{'content-type':'application/json'},body:'{}'})).json();const s=new EventSource('/api/runs/'+r.id+'/events');s.addEventListener('message.delta',e=>out.textContent+=JSON.parse(e.data).text);s.addEventListener('run.completed',()=>s.close())}</script></body></html>
