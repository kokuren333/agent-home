<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/launcher/manifest.webmanifest">
  <link rel="stylesheet" href="/ui/styles.css">
  <link rel="stylesheet" href="/launcher/styles.css">
  <title>agent-home</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>agent-home</h1>
      <div class="topbar-actions">
        <button id="agent-settings" class="ghost" type="button">モデル設定</button>
        <div id="health" class="status"><i></i>確認中</div>
        <div id="backend-status" class="status backend-status"><i></i>Codex CLI確認中</div>
      </div>
    </header>
    <section>
      <div class="section-head"><h2>アプリ</h2><div class="section-actions"><button id="toggle-reorder" class="ghost" type="button">並び替え・表示設定</button><button id="refresh" class="ghost" type="button">更新</button></div></div>
      <p id="apps-order-status" class="apps-order-status" role="status"></p>
      <div id="apps" class="app-grid"><div class="loading">アプリを読み込んでいます…</div></div>
    </section>
  </main>
  <dialog id="agent-settings-dialog" class="settings-dialog">
    <form id="agent-settings-form" method="dialog">
      <div class="dialog-heading">
        <p class="eyebrow">AGENT DEFAULTS</p>
        <h2>実行モデル設定</h2>
        <p>ここで選んだ設定は、すべてのアプリのAgent実行に使われます。</p>
      </div>
      <label>モデル
        <select id="agent-model">
          <option value="">モデル一覧を読み込んでいます…</option>
          <option value="">CLIの既定設定を使う</option>
          <option value="custom">カスタム入力</option>
        </select>
      </label>
      <label id="custom-model-wrap" hidden>カスタムモデル名
        <input id="custom-model" maxlength="100" placeholder="例: gpt-5.6-luna">
      </label>
      <label>Reasoning effort
        <select id="agent-reasoning">
          <option value="low">low</option>
        </select>
      </label>
      <p id="agent-settings-status" class="settings-status" role="status"></p>
      <div class="dialog-actions">
        <button class="ghost" value="cancel" type="submit">キャンセル</button>
        <button class="primary" value="save" type="submit">保存</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/launcher/app.js?v=6"></script>
</body>
</html>
